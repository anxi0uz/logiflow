[project]
name = "logiflow-dispatch"
version = "0.1.0"
description = "Private recommendation service for Logiflow"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "grpcio>=1.84.0",
    "nats-py>=2.12.0",
    "protobuf>=7.36.2",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = ["grpcio-tools>=1.78.0", "pytest>=9.1.1", "pytest-asyncio>=1.2.0", "ruff>=0.14.0"]

[project.scripts]
logiflow-dispatch = "dispatch_service.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispatch_service", "src/logiflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
exclude = ["src/logiflow/dispatch/v1/*_pb2.py", "src/logiflow/dispatch/v1/*_pb2_grpc.py"]
