openapi: 3.0.3
info:
  title: Logiflow API
  description: API для логистической информационной системы
  version: 0.2.0
  contact:
    name: anxi0uz

servers:
  - url: http://localhost:3001
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ─── Common ───────────────────────────────────────────────────────────────

    ApiResponse:
      type: object
      properties:
        status:
          type: integer
          nullable: false
        data:
          type: object
          nullable: true
        success:
          type: boolean
          nullable: false
        requestID:
          type: string
          nullable: false

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        requestID:
          type: string

    DocumentSummary:
      type: object
      required: [id, order_id, type, title, created_at, size_bytes]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        type: { type: string, enum: [transport_order, trip_assignment, cargo_handover, delivery_confirmation, service_report, cancellation_notice] }
        title: { type: string }
        created_at: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64 }

    TripHandoverCreate:
      type: object
      required: [driverId, vehicleId, plannedTo, reason, location, cargoCondition]
      properties:
        driverId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        plannedTo: { type: string, format: date-time }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        location: { type: string, minLength: 1, maxLength: 1000 }
        cargoCondition: { type: string, minLength: 1, maxLength: 2000 }

    TripHandover:
      type: object
      required: [id, orderId, previousAssignmentId, driverId, vehicleId, status, reason, location, cargoCondition, plannedTo, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        previousAssignmentId: { type: string, format: uuid }
        nextAssignmentId: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        createdByUserId: { type: string, format: uuid }
        status: { type: string, enum: [pending, completed, cancelled, expired] }
        reason: { type: string }
        location: { type: string }
        cargoCondition: { type: string }
        plannedTo: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        outgoingConfirmedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }

    # ─── Auth ─────────────────────────────────────────────────────────────────

    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    TokenRefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer

    # ─── User ─────────────────────────────────────────────────────────────────

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        slug:
          type: string
        fullName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, manager, driver, client]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true

    UserUpdate:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 150
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        password:
          type: string
          minLength: 8
          nullable: true
        currentPassword:
          type: string
          minLength: 8
          nullable: true

    UserDeleteRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string

    # ─── Vehicle ──────────────────────────────────────────────────────────────

    Vehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        plateNumber:
          type: string
        brand:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        capacityKg:
          type: number
          nullable: true
        capacityM3:
          type: number
          nullable: true
        status:
          type: string
          enum: [available, in_transit, maintenance]
        slug:
          type: string

    VehicleCreate:
      type: object
      required: [plateNumber]
      properties:
        plateNumber:
          type: string
        brand:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        capacityKg:
          type: number
          nullable: true
        capacityM3:
          type: number
          nullable: true

    VehicleUpdate:
      type: object
      properties:
        brand:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        capacityKg:
          type: number
          nullable: true
        capacityM3:
          type: number
          nullable: true
        status:
          type: string
          enum: [available, in_transit, maintenance]
          nullable: true

    # ─── Warehouse ────────────────────────────────────────────────────────────

    Warehouse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        address:
          type: string
        city:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time

    WarehouseCreate:
      type: object
      required: [name, address, city]
      properties:
        name:
          type: string
        address:
          type: string
          description: Улица и номер дома
        city:
          type: string
          description: Город — используется вместе с address для геокодинга

    WarehouseUpdate:
      type: object
      properties:
        name:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        status:
          type: string
          enum: [active, inactive]
          nullable: true

    # ─── Manager ──────────────────────────────────────────────────────────────

    Manager:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
          nullable: true
        slug:
          type: string

    ManagerCreate:
      type: object
      required: [email, password, fullName, warehouseId]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
        warehouseId:
          type: string
          format: uuid

    # ─── Driver ───────────────────────────────────────────────────────────────

    Driver:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
          nullable: true
        licenseNumber:
          type: string
        licenseExpiry:
          type: string
          format: date
        rating:
          type: number
        slug:
          type: string
        status:
          type: string
          enum: [available, on_route, off_duty]

    DriverCreate:
      type: object
      required: [email, password, fullName, licenseNumber, licenseExpiry]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
        vehicleId:
          type: string
          format: uuid
          nullable: true
        licenseNumber:
          type: string
        licenseExpiry:
          type: string
          format: date

    DriverUpdate:
      type: object
      properties:
        vehicleId:
          type: string
          format: uuid
          nullable: true
        licenseNumber:
          type: string
          nullable: true
        licenseExpiry:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [available, on_route, off_duty]
          nullable: true

    # ─── Order ────────────────────────────────────────────────────────────────

    OrderReferences:
      type: object
      description: Текущие названия только участников и ресурсов доступного заказа. Не заменяют неизменяемые снимки документов. Ключи словарей — UUID; значения — подписи для интерфейса, без email, телефонов и других данных профиля.
      required: [users, drivers, vehicles, warehouses, assignments]
      properties:
        users: { type: object, additionalProperties: { type: string } }
        drivers: { type: object, additionalProperties: { type: string } }
        vehicles: { type: object, additionalProperties: { type: string } }
        warehouses: { type: object, additionalProperties: { type: string } }
        assignments: { type: object, additionalProperties: { type: string } }

    Order:
      type: object
      properties:
        transportPolicyVersion: { type: integer, description: 0 для прежнего порядка; 1 требует реквизиты перед submit и приёмку перед complete. }
        transportDetails: { $ref: "#/components/schemas/TransportDetails" }
        id:
          type: string
          format: uuid
        createdById:
          type: string
          format: uuid
          nullable: true
        driverId:
          type: string
          format: uuid
          nullable: true
        managerId:
          type: string
          format: uuid
          nullable: true
        originWarehouseId:
          type: string
          format: uuid
          nullable: true
        destinationWarehouseId:
          type: string
          format: uuid
          nullable: true
        originAddress:
          type: string
          nullable: true
        destinationAddress:
          type: string
        cargoDescription:
          type: string
          nullable: true
        weightKg:
          type: number
          nullable: true
        volumeM3:
          type: number
          nullable: true
        status:
          type: string
          enum: [draft, ready_for_dispatch, assigned, in_transit, arrived, completed, cancelled]
        totalPrice:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
        pickupFrom:
          type: string
          format: date-time
          nullable: true
        pickupTo:
          type: string
          format: date-time
          nullable: true
        assignedAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true

    CounterpartyWrite:
      type: object
      required: [kind, name, address, contactName]
      properties:
        kind: { type: string, enum: [organization, entrepreneur, individual] }
        name: { type: string, minLength: 1, maxLength: 300 }
        inn: { type: string, maxLength: 12 }
        kpp: { type: string, maxLength: 9 }
        address: { type: string, minLength: 1, maxLength: 1000 }
        contactName: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, maxLength: 40 }
        email: { type: string, maxLength: 254 }
        shared: { type: boolean, description: Только admin может публиковать запись в общем каталоге. }
        status: { type: string, enum: [active, archived] }
    Counterparty:
      allOf:
        - $ref: "#/components/schemas/CounterpartyWrite"
        - type: object
          properties:
            id: { type: string, format: uuid }
            ownerUserId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    TransportDetailsWrite:
      type: object
      required: [senderId, recipientId, carrierId, basisType, basisNumber, basisDate, packageCount]
      properties:
        senderId: { type: string, format: uuid }
        recipientId: { type: string, format: uuid }
        carrierId: { type: string, format: uuid }
        basisType: { type: string, enum: [contract, transport_request] }
        basisNumber: { type: string, minLength: 1, maxLength: 100 }
        basisDate: { type: string, format: date }
        packageCount: { type: integer, minimum: 1 }
        terms: { type: string, maxLength: 2000 }
    TransportDetails:
      type: object
      properties:
        sender: { $ref: "#/components/schemas/Counterparty" }
        recipient: { $ref: "#/components/schemas/Counterparty" }
        carrier: { $ref: "#/components/schemas/Counterparty" }
        basisType: { type: string }
        basisNumber: { type: string }
        basisDate: { type: string, format: date }
        packageCount: { type: integer }
        terms: { type: string }
        recordedByUserId: { type: string, format: uuid }
        recordedAt: { type: string, format: date-time }
    DeliveryReceiptCreate:
      type: object
      required: [assignmentId, recipientName, recipientRole, authorityBasis, packageCount, cargoCondition]
      properties:
        assignmentId: { type: string, format: uuid }
        recipientName: { type: string, minLength: 1, maxLength: 200 }
        recipientRole: { type: string, minLength: 1, maxLength: 200 }
        authorityBasis: { type: string, minLength: 1, maxLength: 1000, description: Основание приёмки со слов подтверждающего; система не проверяет доверенность или подпись. }
        packageCount: { type: integer, minimum: 0 }
        cargoCondition: { type: string, minLength: 1, maxLength: 2000 }
        sealNumber: { type: string, maxLength: 100 }
        comment: { type: string, maxLength: 2000 }
        receivedAt: { type: string, format: date-time, description: Не раньше arrive и не более чем на 5 минут в будущем; по умолчанию время сервера. }
    DeliveryReceipt:
      allOf:
        - $ref: "#/components/schemas/DeliveryReceiptCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            orderId: { type: string, format: uuid }
            recordedAt: { type: string, format: date-time }
            recordedByUserId: { type: string, format: uuid }

    OrderCreate:
      type: object
      description: Укажите адрес назначения или destinationWarehouseId; адрес склада фиксируется сервером.
      properties:
        originWarehouseId:
          type: string
          format: uuid
          nullable: true
        originAddress:
          type: string
          nullable: true
        destinationAddress:
          type: string
          x-go-type-skip-optional-pointer: true
        cargoDescription:
          type: string
          nullable: true
        weightKg:
          type: number
          nullable: true
        volumeM3:
          type: number
          nullable: true
        destinationWarehouseId:
          type: string
          format: uuid
          nullable: true
        pickupFrom:
          type: string
          format: date-time
          nullable: true
        pickupTo:
          type: string
          format: date-time
          nullable: true

    WarehouseOperationCreate:
      type: object
      required: [operationType, packageCount, cargoCondition]
      properties:
        operationType: { type: string, enum: [receive, load, unload, undo_load, return_to_sender] }
        assignmentId:
          type: string
          format: uuid
          description: Обязательно для load/unload/undo_load; должно совпадать с текущим назначением заказа.
        packageCount: { type: integer, minimum: 0, description: Для receive/load строго больше нуля. }
        cargoCondition: { type: string, minLength: 1, maxLength: 2000 }
        comment: { type: string, maxLength: 2000 }
        recipientName: { type: string, maxLength: 200, description: Обязательно для возврата отправителю. }
    WarehouseOperation:
      allOf:
        - $ref: "#/components/schemas/WarehouseOperationCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            orderId: { type: string, format: uuid }
            warehouseId: { type: string, format: uuid }
            createdByUserId: { type: string, format: uuid }
            occurredAt: { type: string, format: date-time }
    WarehouseQueueItem:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            openIncidentCount: { type: integer, minimum: 0 }
            warehouseStage:
              type: string
              enum: [awaiting_receipt, awaiting_assignment, awaiting_loading, ready_to_depart, departed, expected, awaiting_unloading, received, awaiting_return, returned_to_sender, incident_open, completed, cancelled]

    OrderIncidentCreate:
      type: object
      required: [kind, description]
      properties:
        kind: { type: string, enum: [vehicle_breakdown, cargo_damage, quantity_discrepancy, recipient_refusal, other] }
        description: { type: string, minLength: 1, maxLength: 2000 }
        expectedPackages: { type: integer, minimum: 0 }
        actualPackages: { type: integer, minimum: 0 }
    OrderIncidentResolve:
      type: object
      required: [resolution, note]
      properties:
        resolution: { type: string, enum: [repaired, resources_replaced, accept_discrepancy, accept_with_remarks, remediated, recipient_accepted] }
        note: { type: string, minLength: 1, maxLength: 2000 }
        recipientName: { type: string, maxLength: 200 }
    OrderIncident:
      allOf:
        - $ref: "#/components/schemas/OrderIncidentCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            orderId: { type: string, format: uuid }
            assignmentId: { type: string, format: uuid }
            warehouseId: { type: string, format: uuid }
            sourceOperationId: { type: string, format: uuid }
            status: { type: string, enum: [open, resolved] }
            reportedByUserId: { type: string, format: uuid }
            reportedAt: { type: string, format: date-time }
            resolution: { type: string }
            resolutionNote: { type: string }
            recipientName: { type: string }
            resolvedByUserId: { type: string, format: uuid }
            resolvedAt: { type: string, format: date-time }

    OrderDraftUpdate:
      type: object
      description: Изменяются только груз и окно забора; адреса и маршрут сохраняются.
      properties:
        cargoDescription: { type: string }
        weightKg: { type: number, minimum: 0 }
        volumeM3: { type: number, minimum: 0 }
        pickupFrom: { type: string, format: date-time }
        pickupTo: { type: string, format: date-time }

    VehicleDocumentCreate:
      type: object
      required: [type, number, validUntil]
      properties:
        type: { type: string, enum: [registration] }
        number: { type: string }
        validUntil: { type: string, format: date }

    VehicleDocumentUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [valid, suspended, expired] }

    AssignmentCreate:
      type: object
      required: [driverId, vehicleId, plannedFrom, plannedTo]
      properties:
        driverId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        plannedFrom:
          type: string
          format: date-time
        plannedTo:
          type: string
          format: date-time
        replacesAssignmentId:
          type: string
          format: uuid
          nullable: true
        source:
          type: string
          enum: [manual, dispatch_recommendation]
          default: manual
        recommendationId:
          type: string
          nullable: true
        recommendationCreatedAt:
          type: string
          format: date-time
          nullable: true

    AssignmentReject:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
        comment:
          type: string
          nullable: true

    DispatchCandidate:
      type: object
      required: [id, driver_id, vehicle_id, score, reason]
      properties:
        id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        score: { type: number }
        reason: { type: string }

    DispatchRecommendations:
      type: object
      required: [status, candidates]
      properties:
        status: { type: string, enum: [pending, ready, unavailable] }
        createdAt: { type: string, format: date-time, nullable: true }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/DispatchCandidate" }

    DeliveryComplete:
      type: object
      description: Для transportPolicyVersion=1 требуется предварительная delivery-receipt; имя берётся из неё. Поля здесь сохраняются для старых клиентов, противоречащее приёмке имя отклоняется.
      properties:
        recipientName:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true

    OrderCancel:
      type: object
      properties:
        reasonCode:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true

    # ─── Notification ─────────────────────────────────────────────────────────

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ─── Report ───────────────────────────────────────────────────────────────

    DriverStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [available, on_route, off_duty]

    # ─── Dashboard ────────────────────────────────────────────────────────────

    DashboardDriverStat:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        status:
          type: string
          enum: [available, on_route, off_duty]
        rating:
          type: number
        completedOrders:
          type: integer

    DashboardReport:
      type: object
      properties:
        revenue:
          type: object
          properties:
            total:
              type: number
            thisMonth:
              type: number
        orders:
          type: object
          properties:
            total:
              type: integer
            delivered:
              type: integer
            inTransit:
              type: integer
            pending:
              type: integer
            cancelled:
              type: integer
        drivers:
          type: array
          items:
            $ref: "#/components/schemas/DashboardDriverStat"

    # ─── Route ────────────────────────────────────────────────────────────────

    Coordinate:
      type: array
      items:
        type: number
      minItems: 2
      maxItems: 2
      description: "[longitude, latitude] — GeoJSON format"

    Route:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
          nullable: true
        coordinates:
          type: array
          items:
            $ref: "#/components/schemas/Coordinate"
          description: Массив координат маршрута от OSRM
        currentIndex:
          type: integer
          description: Текущая позиция водителя в массиве координат
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        distanceKm:
          type: number
          nullable: true
        durationSec:
          type: integer
          nullable: true
        status:
          type: string
          enum: [pending, active, finished]

    RoutePosition:
      type: object
      description: Сообщение WebSocket — текущая позиция водителя
      properties:
        currentIndex:
          type: integer
        coordinate:
          $ref: "#/components/schemas/Coordinate"
        status:
          type: string
          enum: [active, finished]

paths:
  # ─── Auth ───────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      operationId: authRegister
      summary: Регистрация клиента
      description: Публичный эндпоинт — создаёт аккаунт с ролью client. Для создания менеджеров и водителей используйте POST /managers и POST /drivers (только admin).
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Пользователь создан, токены выданы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email уже занят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: authLogin
      summary: Авторизация
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Обновление access-токена
      tags: [Auth]
      security: []
      responses:
        "200":
          description: Токены обновлены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Недействительный refresh-токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: authLogout
      summary: Выход из системы
      tags: [Auth]
      responses:
        "200":
          description: Успешный выход
        "401":
          description: Не авторизован

  # ─── Me ─────────────────────────────────────────────────────────────────────

  /me:
    get:
      operationId: getMe
      summary: Текущий пользователь
      tags: [Me]
      responses:
        "200":
          description: Данные пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Не авторизован

    patch:
      operationId: updateMe
      summary: Обновить профиль
      tags: [Me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Профиль обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Не авторизован

    delete:
      operationId: deleteMe
      summary: Удалить аккаунт
      tags: [Me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDeleteRequest"
      responses:
        "200":
          description: Аккаунт удалён
        "400":
          description: Неверный пароль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Не авторизован

  /me/trips:
    get:
      operationId: getMyTrips
      summary: Поездки текущего водителя
      tags: [Me]
      description: Доступно только для роли driver. Возвращает маршруты, назначенные на текущего водителя.
      responses:
        "200":
          description: Список маршрутов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "403":
          description: Доступно только водителям

  # ─── Vehicles ───────────────────────────────────────────────────────────────

  /vehicles:
    get:
      operationId: listVehicles
      summary: Список транспортных средств
      tags: [Vehicles]
      responses:
        "200":
          description: Список ТС
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Не авторизован

    post:
      operationId: createVehicle
      summary: Добавить ТС
      description: Только для роли admin; менеджер может просматривать общий автопарк, но не менять его.
      tags: [Vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleCreate"
      responses:
        "200":
          description: ТС создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vehicles/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string

    get:
      operationId: getVehicle
      summary: Получить ТС по slug
      tags: [Vehicles]
      responses:
        "200":
          description: Данные ТС
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          description: Не найдено

    put:
      operationId: updateVehicle
      summary: Обновить ТС
      description: Только для роли admin.
      tags: [Vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleUpdate"
      responses:
        "200":
          description: ТС обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          description: Не найдено

    delete:
      operationId: deleteVehicle
      summary: Удалить ТС
      description: Только для роли admin.
      tags: [Vehicles]
      responses:
        "200":
          description: ТС удалено
        "404":
          description: Не найдено

  /vehicles/{slug}/documents:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listVehicleDocuments
      tags: [Vehicles]
      responses:
        "200": { description: Документы ТС }
    post:
      operationId: createVehicleDocument
      description: Только для роли admin.
      tags: [Vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleDocumentCreate" }
      responses:
        "201": { description: Документ добавлен }

  /vehicles/{slug}/documents/{id}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateVehicleDocument
      description: Только для роли admin.
      tags: [Vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleDocumentUpdate" }
      responses:
        "200": { description: Статус документа обновлён }

  # ─── Warehouses ─────────────────────────────────────────────────────────────

  /warehouses:
    get:
      operationId: listWarehouses
      summary: Список складов
      tags: [Warehouses]
      responses:
        "200":
          description: Список складов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

    post:
      operationId: createWarehouse
      summary: Создать склад
      description: Только для роли admin.
      tags: [Warehouses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseCreate"
      responses:
        "200":
          description: Склад создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Некорректные данные

  /warehouses/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string

    get:
      operationId: getWarehouse
      summary: Получить склад по slug
      tags: [Warehouses]
      responses:
        "200":
          description: Данные склада
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          description: Не найдено

    put:
      operationId: updateWarehouse
      summary: Обновить склад
      description: Только для роли admin.
      tags: [Warehouses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseUpdate"
      responses:
        "200":
          description: Склад обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

    delete:
      operationId: deleteWarehouse
      summary: Удалить склад
      description: Только для роли admin.
      tags: [Warehouses]
      responses:
        "200":
          description: Склад удалён

  # ─── Managers ───────────────────────────────────────────────────────────────

  /managers:
    get:
      operationId: listManagers
      summary: Список менеджеров
      tags: [Managers]
      responses:
        "200":
          description: Список менеджеров
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

    post:
      operationId: createManager
      summary: Создать менеджера
      description: Только для роли admin. Создаёт пользователя с ролью manager и профиль менеджера в одной транзакции.
      tags: [Managers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagerCreate"
      responses:
        "200":
          description: Менеджер создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Некорректные данные

  /managers/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string

    get:
      operationId: getManager
      summary: Получить менеджера по slug
      tags: [Managers]
      responses:
        "200":
          description: Данные менеджера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          description: Не найдено

    delete:
      operationId: deleteManager
      summary: Удалить менеджера
      description: Только для роли admin. Удаляет профиль и отключает учётную запись, сохраняя историю заказов и назначений.
      tags: [Managers]
      responses:
        "200":
          description: Менеджер удалён

  # ─── Drivers ────────────────────────────────────────────────────────────────

  /drivers:
    get:
      operationId: listDrivers
      summary: Список водителей
      tags: [Drivers]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [available, on_route, off_duty]
      responses:
        "200":
          description: Список водителей
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

    post:
      operationId: createDriver
      summary: Создать водителя
      description: Только для роли admin. Создаёт пользователя с ролью driver и профиль водителя в одной транзакции.
      tags: [Drivers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverCreate"
      responses:
        "200":
          description: Водитель создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Некорректные данные

  /drivers/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string

    get:
      operationId: getDriver
      summary: Получить водителя по slug
      tags: [Drivers]
      responses:
        "200":
          description: Данные водителя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          description: Не найдено

    put:
      operationId: updateDriver
      summary: Обновить данные водителя
      description: Только для роли admin.
      tags: [Drivers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverUpdate"
      responses:
        "200":
          description: Данные обновлены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

    delete:
      operationId: deleteDriver
      summary: Удалить водителя
      description: Только для роли admin.
      tags: [Drivers]
      responses:
        "200":
          description: Водитель удалён

  /drivers/me/status:
    patch:
      operationId: updateMyDriverStatus
      summary: Водитель меняет свой статус
      tags: [Drivers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverStatusUpdate"
      responses:
        "200":
          description: Статус обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "403":
          description: Доступно только водителям

  # ─── Orders ─────────────────────────────────────────────────────────────────

  /api/v1/orders:
    get:
      operationId: listOrders
      summary: Список заявок
      tags: [Orders]
      description: >
        Клиент видит только свои заявки, менеджер — заявки своего склада,
        водитель — назначенные на него, администратор — все.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, ready_for_dispatch, assigned, in_transit, arrived, completed, cancelled]
        - name: driverId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Список заявок
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

    post:
      operationId: createOrder
      summary: Создать заявку
      tags: [Orders]
      description: >
        Создаёт черновик заявки, геокодирует адреса через Nominatim и строит маршрут через OSRM.
        Менеджер может создать заявку только для своего originWarehouseId.
        Координаты сохраняются в таблице routes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Некорректные данные или сервис маршрутизации недоступен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getOrder
      summary: Получить заявку
      tags: [Orders]
      responses:
        "200":
          description: Данные заявки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          description: Не найдено

    patch:
      operationId: updateDraftOrder
      summary: Изменить груз и окно забора черновика
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderDraftUpdate" }
      responses:
        "200": { description: Черновик обновлён }
        "409": { description: Заказ уже отправлен }

  /api/v1/counterparties:
    get:
      operationId: listCounterparties
      tags: [Orders]
      summary: Свой каталог контрагентов и общие записи admin
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0, maximum: 10000 } }
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
      responses:
        "200": { description: Каталог контрагентов }
        "403": { description: Роль не допускает чтение каталога }
    post:
      operationId: createCounterparty
      tags: [Orders]
      summary: Создать контрагента в своём каталоге
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CounterpartyWrite" }
      responses:
        "201": { description: Контрагент создан }
        "422": { description: Некорректные реквизиты }
  /api/v1/counterparties/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCounterparty
      tags: [Orders]
      summary: Получить доступного контрагента
      responses:
        "200": { description: Контрагент }
        "404": { description: Запись не найдена или недоступна }
    put:
      operationId: updateCounterparty
      tags: [Orders]
      summary: Заменить реквизиты или архивировать контрагента; снимки заказов сохраняются
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CounterpartyWrite" }
      responses:
        "200": { description: Контрагент обновлён }
        "404": { description: Запись не принадлежит пользователю }
        "422": { description: Некорректные реквизиты }
  /api/v1/orders/{id}/references:
    get:
      operationId: getOrderReferences
      tags: [Orders]
      summary: Имена участников и названия ресурсов карточки заказа
      description: Те же права, что у GetOrder, включая действующее приглашение на передачу и историю прежнего водителя.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Подписи ссылок заказа
          content:
            application/json:
              schema:
                type: object
                required: [references]
                properties:
                  references: { $ref: '#/components/schemas/OrderReferences' }
        '401': { description: Требуется авторизация }
        '403': { description: Нет доступа к заказу }
        '404': { description: Заказ не найден }

  /api/v1/orders/{id}/transport-details:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setTransportDetails
      tags: [Orders]
      summary: Сохранить снимок сторон и основания перевозки в черновике
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransportDetailsWrite" }
      responses:
        "200": { description: Заказ со снимком реквизитов }
        "403": { description: Недоступен заказ или контрагент }
        "409": { description: Заказ уже отправлен или контрагент архивирован }
        "422": { description: Некорректное основание перевозки }
  /api/v1/orders/{id}/delivery-receipt:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getDeliveryReceipt
      tags: [Orders]
      summary: Посмотреть неизменяемую запись фактической приёмки
      responses:
        "200": { description: Приёмка }
        "404": { description: Приёмка ещё не зарегистрирована }
    post:
      operationId: createDeliveryReceipt
      tags: [Orders]
      summary: Зафиксировать фактическую приёмку после arrive
      description: Водитель для адресной доставки; менеджер назначения для складской; admin. Расхождение количества создаёт проблему, complete остаётся отдельной командой.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryReceiptCreate" }
      responses:
        "201": { description: Приёмка сохранена }
        "403": { description: Нет права подтверждения }
        "409": { description: Неподходящий этап или приёмка уже сохранена }
        "422": { description: Некорректные данные или количество отличается от складской разгрузки }

  /api/v1/orders/{id}/submit:
    post:
      operationId: submitOrder
      summary: Подготовить заказ к диспетчеризации
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Заказ готов к диспетчеризации }
        "409": { description: Недопустимый переход }

  /api/v1/orders/{id}/cancel:
    post:
      operationId: cancelOrder
      summary: Отменить заказ
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCancel" }
      responses:
        "200": { description: Заказ отменён }
        "409": { description: Заказ нельзя отменить }

  /api/v1/orders/{id}/assignments:
    get:
      operationId: listOrderAssignments
      summary: История назначений заказа
      tags: [Assignments]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Назначения заказа }
    post:
      operationId: createAssignment
      summary: Предложить или заменить назначение
      tags: [Assignments]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentCreate" }
      responses:
        "201": { description: Назначение создано }
        "409": { description: Ресурс занят или состояние изменилось }

  /api/v1/orders/{id}/dispatch-recommendations:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getDispatchRecommendations
      summary: Текущие рекомендации для менеджера
      description: Возвращает pending, ready или unavailable; рекомендации не резервируют ресурсы.
      tags: [Assignments]
      responses:
        "200":
          description: Состояние и кандидаты
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "403": { description: Нет доступа }
    post:
      operationId: refreshDispatchRecommendations
      summary: Пересчитать рекомендации синхронно
      tags: [Assignments]
      responses:
        "200":
          description: Новые кандидаты
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "409": { description: Заказ уже не ожидает назначения }
        "503": { description: Dispatch недоступен }

  /api/v1/assignments:
    get:
      operationId: listAssignments
      summary: Предложения водителя или назначения менеджера
      tags: [Assignments]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending_acceptance, accepted, active, rejected, released, expired, completed] }
        - name: orderId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Список назначений }

  /api/v1/assignments/{id}/accept:
    post:
      operationId: acceptAssignment
      summary: Принять назначение
      tags: [Assignments]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Назначение принято }

  /api/v1/assignments/{id}/reject:
    post:
      operationId: rejectAssignment
      summary: Отклонить назначение
      tags: [Assignments]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentReject" }
      responses:
        "200": { description: Назначение отклонено }

  /api/v1/assignments/{id}/start:
    post:
      operationId: startAssignment
      summary: Начать перевозку
      tags: [Assignments]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Перевозка началась }

  /api/v1/assignments/{id}/arrive:
    post:
      operationId: arriveAssignment
      summary: Подтвердить прибытие
      tags: [Assignments]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Прибытие подтверждено }

  /api/v1/assignments/{id}/complete:
    post:
      operationId: completeAssignment
      summary: Подтвердить доставку
      tags: [Assignments]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryComplete" }
      responses:
        "200": { description: Доставка завершена }

  /api/v1/orders/{id}/warehouse-operations:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listOrderWarehouseOperations
      summary: Журнал складских операций заказа
      tags: [Warehouses]
      responses:
        "200":
          description: Журнал с участниками и фактическими сведениями
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      operations:
                        type: array
                        items: { $ref: "#/components/schemas/WarehouseOperation" }
    post:
      operationId: createWarehouseOperation
      summary: Подтвердить приёмку, погрузку, разгрузку, снятие погрузки или возврат
      description: Менеджер соответствующего склада или admin. receive после submit; load перед стартом; unload после прибытия; undo_load до выезда; return_to_sender после отмены. Повтор операции — 409.
      tags: [Warehouses]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WarehouseOperationCreate" }
      responses:
        "201": { description: Складская операция зарегистрирована }
        "403": { description: Чужой склад или неподходящая роль }
        "409": { description: Неверный этап, повтор или отсутствие предшествующей операции }
        "422": { description: Неверные фактические сведения }
  /api/v1/warehouses/{id}/orders:
    get:
      operationId: listWarehouseQueue
      summary: Очередь входящих и исходящих заказов склада
      tags: [Warehouses]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: includeClosed
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        "200":
          description: Заказы с текущим warehouseStage
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items: { $ref: "#/components/schemas/WarehouseQueueItem" }
        "403": { description: Менеджеру доступна только очередь своего склада }

  /api/v1/orders/{id}/incidents:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listOrderIncidents
      summary: История проблем и решений по заказу
      tags: [Orders]
      responses:
        "200":
          description: История инцидентов
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      incidents:
                        type: array
                        items: { $ref: "#/components/schemas/OrderIncident" }
    post:
      operationId: createOrderIncident
      summary: Сообщить о проблеме перевозки
      description: Владелец, менеджер своего склада, текущий принявший назначение водитель или admin.
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderIncidentCreate" }
      responses:
        "201": { description: Проблема зарегистрирована; старт/завершение блокируются до решения }
        "403": { description: Нет права сообщать о проблеме }
        "409": { description: Недопустимый этап }
  /api/v1/incidents/{id}/resolve:
    post:
      operationId: resolveOrderIncident
      summary: Зафиксировать решение менеджера по проблеме
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderIncidentResolve" }
      responses:
        "200": { description: Решение и его автор сохранены }
        "403": { description: Решение доступно ответственному менеджеру/admin }
        "409": { description: Повтор решения или недостаточно подтверждений }

  /api/v1/documents:
    get:
      operationId: listInboxDocuments
      summary: Документы в личном ящике
      description: Возвращает только документы авторизованного пользователя.
      tags: [Documents]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        "200":
          description: Список документов
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: array
                        items: { $ref: "#/components/schemas/DocumentSummary" }
        "401": { description: Требуется авторизация }
        "503": { description: Сервис документов недоступен }

  /api/v1/documents/{id}/download:
    get:
      operationId: downloadInboxDocument
      summary: Скачать документ из личного ящика
      description: Для чужого или несуществующего документа возвращает 404.
      tags: [Documents]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: PDF-файл
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { description: Требуется авторизация }
        "404": { description: Документ не найден или недоступен }
        "503": { description: Сервис документов недоступен }

  /orders/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    patch:
      operationId: updateOrderStatus
      summary: Устаревшее универсальное обновление статуса
      tags: [Orders]
      deprecated: true
      description: Всегда возвращает 410. Используйте явные команды `/api/v1/orders/...` и `/api/v1/assignments/...`.
      responses:
        "410":
          description: Универсальное изменение статуса удалено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  # ─── Routes ─────────────────────────────────────────────────────────────────

  /orders/{id}/route:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getRoute
      summary: Получить маршрут заявки
      tags: [Routes]
      description: Возвращает весь маршрут с координатами и текущим индексом только пользователю с доступом к заказу.
      responses:
        "200":
          description: Данные маршрута
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          description: Маршрут не найден

  /orders/{id}/route/ws:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: routeWebSocket
      summary: WebSocket трекинг маршрута
      tags: [Routes]
      description: >
        Проверяет доступ к заказу до WebSocket upgrade. Во время перевозки сервер
        отправляет RoutePosition и двигает current_index по массиву координат.
      responses:
        "101":
          description: Switching Protocols — WebSocket установлен
        "404":
          description: Маршрут не найден

  # ─── Notifications ───────────────────────────────────────────────────────────

  /notifications:
    get:
      operationId: listNotifications
      summary: Список уведомлений текущего пользователя
      tags: [Notifications]
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Список уведомлений
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Не авторизован

  /notifications/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    patch:
      operationId: markNotificationRead
      summary: Отметить уведомление как прочитанное
      tags: [Notifications]
      responses:
        "200":
          description: Отмечено
        "404":
          description: Не найдено

  # ─── Reports ─────────────────────────────────────────────────────────────────

  /reports/orders:
    get:
      operationId: getOrdersReport
      summary: Отчёт по заявкам
      tags: [Reports]
      description: Доступно для ролей admin и manager. Менеджер получает только заказы своего склада; admin — все.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, ready_for_dispatch, assigned, in_transit, arrived, completed, cancelled]
        - name: driverId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: warehouseId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Отчёт сформирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "403":
          description: Нет доступа

  /reports/dashboard:
    get:
      operationId: getDashboard
      summary: Дашборд менеджмента
      description: Доступно для ролей admin и manager. Статистика менеджера ограничена заказами его склада.
      tags: [Reports]
      responses:
        "200":
          description: Данные дашборда
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "403":
          description: Нет доступа

  /api/v1/orders/{id}/handovers:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listTripHandovers
      security: [{ BearerAuth: [] }]
      summary: История передачи груза при замене ресурсов в пути
      responses:
        '200': { description: История передач }
    post:
      operationId: createTripHandover
      security: [{ BearerAuth: [] }]
      summary: Менеджер запрашивает замену водителя или машины в пути
      description: До подтверждения обеими сторонами старое назначение сохраняется. Целевые ресурсы проверяются и бронируются при accept.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripHandoverCreate' }
      responses:
        '201': { description: Запрос передачи создан }
        '403': { description: Недостаточно прав }
        '409': { description: Неверное состояние или уже есть запрос }
        '422': { description: Некорректные данные или ресурсы }

  /api/v1/handovers/incoming:
    get:
      operationId: listIncomingTripHandovers
      security: [{ BearerAuth: [] }]
      summary: Собственные входящие передачи груза водителя
      description: Только действующие pending приглашения в рейсах in_transit с активным прежним назначением. Не требует наличия назначения у принимающего водителя.
      responses:
        '200':
          description: Входящие приглашения
          content:
            application/json:
              schema:
                type: object
                required: [handovers]
                properties:
                  handovers:
                    type: array
                    items: { $ref: '#/components/schemas/TripHandover' }
        '401': { description: Требуется авторизация }
        '403': { description: Только для водителя }

  /api/v1/handovers/{id}/confirm-release:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: confirmTripHandoverRelease
      security: [{ BearerAuth: [] }]
      summary: Передающий водитель подтверждает сведения о передаче
      responses:
        '200': { description: Подтверждение зафиксировано }
        '403': { description: Только текущий водитель }
        '409': { description: Запрос истек или состояние изменилось }

  /api/v1/handovers/{id}/accept:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: acceptTripHandover
      security: [{ BearerAuth: [] }]
      summary: Принимающий водитель подтверждает прием груза и продолжает рейс
      description: После confirm-release атомарно закрывает старое назначение и создает active назначение. Это подтверждение учетной записью, не УКЭП.
      responses:
        '200': { description: Передача завершена }
        '403': { description: Только принимающий водитель }
        '409': { description: Нет первого подтверждения, запрос истек или конфликт брони }

  /api/v1/handovers/{id}/cancel:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelTripHandover
      security: [{ BearerAuth: [] }]
      summary: Менеджер отменяет незавершенный запрос передачи
      responses:
        '200': { description: Запрос отменен, прежнее назначение сохранено }
        '403': { description: Недостаточно прав }
        '409': { description: Запрос уже закрыт }
